<!DOCTYPE html>

<html lang="id"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Download SPMT</title>

<style> * { box-sizing: border-box; margin: 0; padding: 0; } html, body { width: 100%; min-height: 100%; background: #f5f7fa; font-family: Arial, Helvetica, sans-serif; overflow-x: hidden; } body { display: flex; flex-direction: column; } /* Header */ .header { width: 100%; background: linear-gradient(135deg, #0d47a1, #1565c0); color: white; padding: 14px 16px; text-align: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); position: relative; z-index: 10; } .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; } .header p { font-size: 12px; opacity: 0.9; } /* Container iframe */ .frame-container { width: 100%; flex: 1; position: relative; background: #fff; overflow: hidden; } #uploadFrame { display: block; width: 100%; height: calc(100vh - 70px); min-height: 600px; border: none; background: white; } /* Loading */ .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: #f5f7fa; z-index: 5; transition: opacity 0.3s ease; } .loading.hidden { opacity: 0; pointer-events: none; } .spinner { width: 38px; height: 38px; border: 4px solid #dbe4f0; border-top-color: #1565c0; border-radius: 50%; animation: spin 0.8s linear infinite; } .loading-text { font-size: 14px; color: #555; } @keyframes spin { to { transform: rotate(360deg); } } /* Tampilan HP */ @media (max-width: 600px) { .header { padding: 12px 10px; } .header h1 { font-size: 18px; } .header p { font-size: 11px; } #uploadFrame { height: calc(100vh - 62px); min-height: 650px; } } /* Tampilan Tablet */ @media (min-width: 601px) and (max-width: 1024px) { .header h1 { font-size: 21px; } #uploadFrame { height: calc(100vh - 72px); } } /* Tampilan Desktop */ @media (min-width: 1025px) { body { background: #eef2f7; } .header { padding: 16px; } .frame-container { width: 100%; max-width: 1200px; margin: 0 auto; box-shadow: 0 0 15px rgba(0, 0, 0, 0.08); } #uploadFrame { height: calc(100vh - 74px); } } </style>

</head>

<body>

<!-- Header -->

<header class="header"> <h1>Download SPMT</h1> <p>Surat Pernyataan Melaksanakan Tugas</p> </header>

<!-- Iframe -->

<main class="frame-container">

<!-- Loading -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Memuat halaman...</div>
</div>

<iframe
  id="uploadFrame"
  src="https://script.google.com/macros/s/AKfycbxe5v5VmHW7h6R9Muc0enreYXZUebPVgWty-Bz9n-ZxB3eP1wEgmEhptKvywBDuk06x/exec"
  title="Download SPMT"
  scrolling="no"
  allow="clipboard-read; clipboard-write"
  loading="eager">
</iframe>

</main>

<script> const iframe = document.getElementById("uploadFrame"); const loading = document.getElementById("loading"); iframe.addEventListener("load", function () { loading.classList.add("hidden"); setTimeout(() => { loading.style.display = "none"; }, 400); }); </script>

</body> </html>
